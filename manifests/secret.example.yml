---
# TEMPLATE ONLY - do not commit a populated copy.
#
# Kubernetes Secrets are base64-encoded, not encrypted. Create the real Secret
# at deploy time instead:
#
#   kubectl create secret generic devopsdb-secret \
#     --from-literal=MYSQL_ROOT_PASSWORD='<choose-a-strong-password>' \
#     --from-literal=MYSQL_DATABASE=accounts
apiVersion: v1
kind: Secret
metadata:
  name: devopsdb-secret
  labels:
    app: db
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: REPLACE_ME
  MYSQL_DATABASE: accounts
