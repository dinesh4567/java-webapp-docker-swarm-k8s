#JDBC Configuration for Database Connection
# Credentials are resolved from environment variables at startup so they are
# never committed. Spring's <context:property-placeholder> (appconfig-root.xml)
# searches the system environment, so MYSQL_ROOT_PASSWORD comes from the
# Kubernetes Secret or the Swarm environment. The ":" suffix supplies an empty
# default so a missing variable fails at connect time rather than at context load.
jdbc.driverClassName=com.mysql.jdbc.Driver
jdbc.url=jdbc:mysql://${DB_HOST:devopsdb}:3306/${MYSQL_DATABASE:accounts}?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull
jdbc.username=${DB_USER:root}
jdbc.password=${MYSQL_ROOT_PASSWORD:}

#Memcached Configuration For Active and StandBy Host
#For Active Host
memcached.active.host=vprocache01
memcached.active.port=11211
#For StandBy Host
memcached.standBy.host=vprocache02
memcached.standBy.port=11211

#RabbitMq Configuration
rabbitmq.address=vpromq01
rabbitmq.port=15672
rabbitmq.username=guest
rabbitmq.password=guest

#Elasticesearch Configuration
elasticsearch.host =vprosearch01
elasticsearch.port =9300
elasticsearch.cluster=vprofile
elasticsearch.node=vprofilenode
